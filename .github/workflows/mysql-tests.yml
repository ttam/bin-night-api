name: MySQL Tests

# Production runs MySQL 8.0, and the rest of the tests run on SQLite, which agrees with itself and has hidden real MySQL
# differences before. This runs the feature suite (the whole HTTP stack, the notification command, the migrations) on
# real MySQL, the same as `composer test:mysql` does locally. Anything that reads or writes dates, or touches a query or a
# migration, has to pass here.

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  MySQL-Tests:
    runs-on: ubuntu-latest
    name: MySQL ${{ matrix.mysql }}

    strategy:
      fail-fast: false
      matrix:
        # 8.0 is what production runs; 8.4 is the supported LTS line, so it is known to work before it is needed.
        mysql: ['8.0.42', '8.4']

    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: binnight_test
          # Leaves MySQL's timezone tables empty, as they are on a stock server, so these tests also prove that nothing
          # depends on them (CONVERT_TZ() with a zone name is NULL there).
          MYSQL_INITDB_SKIP_TZINFO: '1'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache PHP dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.composer/cache
            vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock','**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          extensions: pdo_mysql
          coverage: none

      - name: Install Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Copy Environment File
        run: cp .env.example .env

      # After the install: artisan needs vendor/, which a cold cache does not have yet.
      - name: Generate Application Key
        run: php artisan key:generate

      - name: Check the server is the one we asked for, with its timezone tables empty
        run: |
          mysql -h 127.0.0.1 -uroot -N -e "SELECT CONCAT('MySQL ', VERSION(), ', timezone tables loaded: ', COUNT(*)) FROM mysql.time_zone_name"
          test "$(mysql -h 127.0.0.1 -uroot -N -e 'SELECT COUNT(*) FROM mysql.time_zone_name')" = "0"

      - name: Feature tests on MySQL
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: binnight_test
          DB_USERNAME: root
          DB_PASSWORD: ''
          DB_URL: ''
        run: php artisan test tests/Feature
